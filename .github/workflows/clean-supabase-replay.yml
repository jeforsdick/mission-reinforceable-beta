name: Clean Supabase migration replay

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-supabase-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay every migration from empty
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR commit
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pinned to the version verified in the preceding successful runner.
          # Avoid unauthenticated GitHub API rate limits when resolving 'latest'.
          version: 2.121.0

      - name: Confirm isolated runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # No secrets are referenced by this workflow. Fail closed if the
          # runner environment ever acquires credentials unexpectedly.
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          docker info
          supabase --version

      - name: Run Research Operations launch-readiness tests
        run: |
          node --test research-admin/baseline-launch-readiness.test.mjs
          node --test research-admin/baseline-to-intervention.test.mjs
          node --test research-admin/multiple-probe-baseline.test.mjs
          node --test research-admin/teacher-launch-first-week.test.mjs

      - name: Verify mission navigation and resume behavior
        run: node --test game/js/mission-resume.test.mjs

      - name: Run navigation, game integrity, and dose-lock regression tests
        run: |
          node --test \
            game/js/mission-resume.test.mjs \
            game/js/daily-mission-lock.test.mjs \
            game/js/study-calendar.test.mjs \
            game/js/telemetry-integrity.test.mjs \
            game/js/fidelity-target-linkage.test.mjs \
            game/js/protected-choice-shuffling.test.mjs \
            game/js/rich-mission-feedback.test.mjs \
            game/js/scenario-fit.test.mjs \
            game/js/resources.test.mjs \
            game/js/home-status-message.test.mjs

      - name: Validate fictional public-demo story, Resource Map, and navigation
        run: node --test game/js/public-demo-fixture.test.mjs

      - name: Replay clean local database
        run: ./scripts/replay-clean-supabase.sh
