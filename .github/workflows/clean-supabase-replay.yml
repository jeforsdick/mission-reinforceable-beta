name: Clean Supabase migration replay

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clean-supabase-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay:
    name: Replay every migration from empty
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR commit
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Confirm isolated runner prerequisites
        shell: bash
        run: |
          set -euo pipefail
          # No secrets are referenced by this workflow. Fail closed if the
          # runner environment ever acquires credentials unexpectedly.
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_URL:-}"
          docker info
          supabase --version

      - name: Replay clean local database
        run: ./scripts/replay-clean-supabase.sh
