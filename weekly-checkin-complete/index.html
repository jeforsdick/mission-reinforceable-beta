<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weekly Check-In Complete | Mission: Reinforceable</title>
  <link rel="icon" href="/favicon.png" />
  <link rel="stylesheet" href="/assets/site/site.css" />
  <link rel="stylesheet" href="/assets/site/mobile-brand.css" />
</head>
<body>
  <div class="site-shell completion-page">
    <header class="site-header">
      <div class="nav-wrap">
        <a class="brand" href="/" aria-label="Mission: Reinforceable Home">
          <img class="brand-icon" src="/favicon.png" alt="" />
          <img class="brand-logo" src="/assets/game/skin-v2/mission-reinforceable-title.png" alt="Mission: Reinforceable" />
        </a>
        <nav class="nav-links" aria-label="Primary navigation">
          <div class="nav-menu" id="primary-nav-menu">
            <a href="/">Home</a>
            <a href="/research/">Research</a>
            <a href="/intake/">New Game</a>
            <a href="/demo/">Play Demo</a>
            <a href="/coach-dashboard/">Coach Login</a>
          </div>
          <a class="nav-cta" href="/game/">Teacher Login</a>
          <button class="nav-toggle" type="button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="primary-nav-menu" hidden><span aria-hidden="true"></span></button>
        </nav>
      </div>
    </header>

    <main class="completion-main">
      <section class="completion-card" aria-live="polite" aria-labelledby="completion-title">
        <div id="completion-icon" class="completion-icon" aria-hidden="true"></div>
        <p class="eyebrow">Weekly Check-In</p>
        <h1 id="completion-title">Finishing your weekly check-in…</h1>
        <p id="completion-detail" class="completion-detail">Please keep this page open for a moment.</p>
        <button id="completion-retry" class="button button-primary" type="button" hidden>Retry</button>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span>Mission: Reinforceable</span>
        <span>Game-based practice for behavior support implementation.</span>
      </div>
    </footer>
  </div>
  <script type="module" src="./completion.js"></script>
  <script src="/assets/site/site-nav.js"></script>
</body>
</html>
