<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly check-in complete</title><style>body{margin:0;background:#f4f7f5;color:#17352d;font:18px/1.5 system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.card{background:white;border-radius:18px;box-shadow:0 10px 35px #17352d22;margin:1rem;max-width:30rem;padding:2.5rem;text-align:center}h1{font-size:2rem;margin:.25rem}.check{color:#18865b;font-size:3rem}p{margin:.75rem 0}</style></head><body><main class="card"><div class="check" aria-hidden="true">✓</div><h1>All done!</h1><p>Your weekly Mission: Reinforceable check-in is complete.</p><p>Thanks for taking a minute to check in.</p></main><script>const token=new URLSearchParams(location.search).get('token');if(token){fetch('/api/weekly-checkin-complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}).catch(()=>{});history.replaceState({},'',location.pathname);}</script></body></html>
