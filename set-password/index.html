<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set Password | Mission: Reinforceable</title><link rel="icon" href="../favicon.png"><link rel="stylesheet" href="set-password.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script><script src="set-password.js" defer></script></head>
<body><main><section class="login-card" aria-labelledby="setup-title"><img src="../assets/game/skin-v2/mission-reinforceable-title.png" alt="Mission: Reinforceable"><p class="eyebrow">Teacher access</p><h1 id="setup-title">Create your password</h1><p id="setup-status" class="status" role="status">Checking your secure link…</p><form id="password-form" hidden><label for="new-password">New password</label><input id="new-password" name="password" type="password" minlength="12" maxlength="64" autocomplete="new-password" required><small>Use 12–64 characters.</small><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirmation" type="password" minlength="12" maxlength="64" autocomplete="new-password" required><button type="submit">Set Password and Open Mission</button><p id="form-error" class="error" role="alert"></p></form></section></main></body></html>
